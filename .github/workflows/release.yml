name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      resume_tag:
        description: 'Retomar a mesma pre-release existente, sem criar ou mover tag'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: scale-release
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ci:version && npm run ci:tauri && node --test tests/*.test.mjs scripts/release/tests/*.test.mjs
      - run: npm run build:web
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESUME_TAG: ${{ inputs.resume_tag }}
          RELEASE_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: node scripts/release/prepare-ci.mjs
  desktop:
    permissions:
      contents: write
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Reuse completed desktop assets from the current verified tag
        id: restore
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { execFileSync } = require('node:child_process');
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const release = releases.find(item => item.tag_name === process.env.TAG);
            if (!release) throw new Error(`Draft release not found: ${process.env.TAG}`);
            const target = process.env.TARGET || '';
            const prefix = `Scale-Simulator-${process.env.VERSION}-${target}`;
            const names = ['web', 'sources'].map(kind => `Scale-Simulator-${process.env.VERSION}-${kind}.zip`);
            const assets = target
              ? release.assets.filter(asset => asset.name.startsWith(prefix) && asset.state === 'uploaded')
              : names.map(name => release.assets.find(asset => asset.name === name && asset.state === 'uploaded'));
            const suffixes = target.includes('windows') ? ['.exe', '.msi'] : target.includes('linux') ? ['.AppImage', '.deb', '.rpm'] : ['.dmg', '.app.tar.gz'];
            const complete = target ? suffixes.every(suffix => assets.some(asset => asset.name.endsWith(suffix))) : assets.every(Boolean);
            if (!complete) { core.setOutput('restored', 'false'); return; }
            fs.mkdirSync('release-assets', {recursive: true});
            for (const asset of assets) {
              if (!/^[A-Za-z0-9_. -]+$/.test(asset.name)) throw new Error('Unsafe asset name');
              if (!/^sha256:[a-f0-9]{64}$/.test(asset.digest || '')) throw new Error(`Missing digest: ${asset.name}`);
              execFileSync('gh', ['release', 'download', process.env.TAG, '--pattern', asset.name, '--dir', 'release-assets']);
              const hash = crypto.createHash('sha256').update(fs.readFileSync(`release-assets/${asset.name}`)).digest('hex');
              if (`sha256:${hash}` !== asset.digest) throw new Error(`Digest mismatch: ${asset.name}`);
            }
            core.setOutput('restored', 'true');
      - uses: actions/setup-node@v4
        if: steps.restore.outputs.restored != 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Linux dependencies
        if: steps.restore.outputs.restored != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        if: steps.restore.outputs.restored != 'true'
        with:
          targets: ${{ matrix.target }}
      - name: Short Windows build path
        if: steps.restore.outputs.restored != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: '"CARGO_TARGET_DIR=C:\scale-target" >> $env:GITHUB_ENV'
      - uses: swatinem/rust-cache@v2
        if: steps.restore.outputs.restored != 'true'
        with:
          workspaces: "./src-tauri -> ${{ runner.os == 'Windows' && 'C:/scale-target' || 'target' }}"
          key: release-${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
        if: steps.restore.outputs.restored != 'true'
      - run: node scripts/ci/check-version-sync.mjs --tag ${{ needs.prepare.outputs.tag }}
        if: steps.restore.outputs.restored != 'true'
      - name: Build desktop with numeric MSI package version
        if: steps.restore.outputs.restored != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          EXTRA=()
          if [[ "$TARGET" == *windows* ]]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const m = /^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/.exec(process.env.RELEASE_VERSION || '');
          if (!m) throw new Error('Unsupported MSI release version');
          const parts = m.slice(1).map(v => Number(v || 0));
          if (parts.some((v, i) => !Number.isSafeInteger(v) || v > (i < 2 ? 255 : 65535))) throw new Error('MSI numeric version out of range');
          const config = {bundle: {windows: {wix: {version: parts.join('.')}}}};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'scale-msi-config.json'), JSON.stringify(config));
          NODE
            EXTRA=(--config "$RUNNER_TEMP/scale-msi-config.json")
          fi
          npm run tauri -- build --target "$TARGET" "${EXTRA[@]}"
      - name: Collect platform bundles
        if: steps.restore.outputs.restored != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release/collect-assets.py
      - name: Upload verified bundles to draft release
        if: steps.restore.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release/upload-draft-assets.mjs
  web:
    permissions:
      contents: write
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Reuse completed web assets from the current verified tag
        id: restore
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { execFileSync } = require('node:child_process');
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const release = releases.find(item => item.tag_name === process.env.TAG);
            if (!release) throw new Error(`Draft release not found: ${process.env.TAG}`);
            const target = process.env.TARGET || '';
            const prefix = `Scale-Simulator-${process.env.VERSION}-${target}`;
            const names = ['web', 'sources'].map(kind => `Scale-Simulator-${process.env.VERSION}-${kind}.zip`);
            const assets = target
              ? release.assets.filter(asset => asset.name.startsWith(prefix) && asset.state === 'uploaded')
              : names.map(name => release.assets.find(asset => asset.name === name && asset.state === 'uploaded'));
            const suffixes = target.includes('windows') ? ['.exe', '.msi'] : target.includes('linux') ? ['.AppImage', '.deb', '.rpm'] : ['.dmg', '.app.tar.gz'];
            const complete = target ? suffixes.every(suffix => assets.some(asset => asset.name.endsWith(suffix))) : assets.every(Boolean);
            if (!complete) { core.setOutput('restored', 'false'); return; }
            fs.mkdirSync('release-assets', {recursive: true});
            for (const asset of assets) {
              if (!/^[A-Za-z0-9_. -]+$/.test(asset.name)) throw new Error('Unsafe asset name');
              if (!/^sha256:[a-f0-9]{64}$/.test(asset.digest || '')) throw new Error(`Missing digest: ${asset.name}`);
              execFileSync('gh', ['release', 'download', process.env.TAG, '--pattern', asset.name, '--dir', 'release-assets']);
              const hash = crypto.createHash('sha256').update(fs.readFileSync(`release-assets/${asset.name}`)).digest('hex');
              if (`sha256:${hash}` !== asset.digest) throw new Error(`Digest mismatch: ${asset.name}`);
            }
            core.setOutput('restored', 'true');
      - uses: actions/setup-node@v4
        if: steps.restore.outputs.restored != 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.restore.outputs.restored != 'true'
        run: npm ci --no-audit --no-fund && npm run build:web
      - if: steps.restore.outputs.restored != 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir release-assets
          (cd dist && zip -qr "../release-assets/Scale-Simulator-${VERSION}-web.zip" .)
          git archive --format=zip -o "release-assets/Scale-Simulator-${VERSION}-sources.zip" HEAD
      - name: Upload web and sources to draft release
        if: steps.restore.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release/upload-draft-assets.mjs
  publish:
    needs: [prepare, desktop, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Collect all completed platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$TAG" --pattern "Scale-Simulator-*" --dir release-assets
      - name: Checksums and manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release/checksums.py
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$STATE" = "false" ]; then
            echo "Release already published: no assets will be overwritten."
            exit 0
          fi
          RELEASE_TAG="$TAG" node scripts/release/upload-draft-assets.mjs
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
