name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scale-release
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ci:version && npm run ci:tauri && node --test tests/*.test.mjs scripts/release/tests/*.test.mjs
      - run: npm run build:web
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: node scripts/release/prepare-ci.mjs
  desktop:
    permissions:
      contents: write
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Short Windows build path
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CARGO_TARGET_DIR=C:\scale-target" >> $env:GITHUB_ENV'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> ${{ runner.os == 'Windows' && 'C:/scale-target' || 'target' }}"
          key: release-${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/check-version-sync.mjs --tag ${{ needs.prepare.outputs.tag }}
      - run: npm run tauri -- build --locked --target ${{ matrix.target }}
      - name: Collect platform bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release/collect-assets.py
      - name: Upload verified bundles to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release/upload-draft-assets.mjs
  web:
    permissions:
      contents: write
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build:web
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir release-assets
          (cd dist && zip -qr ../release-assets/Scale-Simulator-${VERSION}-web.zip .)
          git archive --format=zip -o release-assets/Scale-Simulator-${VERSION}-sources.zip HEAD
      - name: Upload web and sources to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release/upload-draft-assets.mjs
  publish:
    needs: [prepare, desktop, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Collect all completed platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$TAG" --dir release-assets
      - name: Checksums and manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release/checksums.py
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$STATE" = "false" ]; then
            echo "Release already published: no assets will be overwritten."
            exit 0
          fi
          RELEASE_TAG="$TAG" node scripts/release/upload-draft-assets.mjs
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
