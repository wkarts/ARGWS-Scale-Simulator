name: CloudPanel Linux Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Arquitetura do release"
        required: true
        default: "all"
        type: choice
        options:
          - x64
          - x86
          - all

permissions:
  contents: read

concurrency:
  group: cloudpanel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CloudPanel Linux ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-gnu
          - arch: x86
            target: i686-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Debian/Ubuntu build dependencies
        if: >-
          inputs.target == 'all' ||
          inputs.target == matrix.arch
        run: bash ./scripts/linux/install-cloudpanel-build-deps.sh --${{ matrix.arch }}

      - name: Setup Node
        if: >-
          inputs.target == 'all' ||
          inputs.target == matrix.arch
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        if: >-
          inputs.target == 'all' ||
          inputs.target == matrix.arch
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve Cargo lockfile
        if: >-
          inputs.target == 'all' ||
          inputs.target == matrix.arch
        run: test -f src-tauri/Cargo.lock

      - name: Build release
        if: >-
          inputs.target == 'all' ||
          inputs.target == matrix.arch
        run: bash ./scripts/linux/build-cloudpanel-release.sh --${{ matrix.arch }}

      - name: Upload artifacts
        if: >-
          inputs.target == 'all' ||
          inputs.target == matrix.arch
        uses: actions/upload-artifact@v7
        with:
          name: cloudpanel-linux-${{ matrix.arch }}
          path: |
            release/cloudpanel/*.tar.gz
            release/cloudpanel/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
