name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  workflow-lint:
    name: GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate workflows
        run: actionlint

  pr-title:
    name: Pull Request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate title
        run: npm run ci:pr-title

  static:
    name: Project structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate project structure
        run: |
          python3 scripts/ci/validate-tauri-project.py --project . --mode static
          python3 tests/test_scale_release_profile.py

  delivery-scripts:
    name: Delivery scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          bash -n scripts/linux/build-cloudpanel-release.sh
          bash -n scripts/linux/build-cloudpanel-release-docker.sh
          bash -n scripts/linux/install-cloudpanel-build-deps.sh
          bash -n scripts/mobile/build-ios-unsigned.sh
          bash -n scripts/release/package-ios-unsigned.sh
          bash -n deploy/cloudpanel/start.sh
          bash -n deploy/cloudpanel/stop.sh
          bash -n deploy/cloudpanel/restart.sh
          bash -n deploy/cloudpanel/status.sh
          bash -n deploy/cloudpanel/check.sh
          bash -n deploy/cloudpanel/cli.sh
          bash -n deploy/cloudpanel/worker.sh
          bash -n deploy/cloudpanel/ports.sh

      - name: Validate Node.js delivery scripts
        run: |
          node --check scripts/mobile/generate-mobile-icons.mjs
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Test release pipeline
        run: node --test scripts/release/tests/*.test.mjs
      - name: Setup Rust for real release metadata validation
        uses: dtolnay/rust-toolchain@stable
      - name: Dry-run actual beta preparation without publishing
        run: |
          node scripts/release/check-beta-prepare.mjs
          node scripts/release/check-source-pipeline.mjs

  windows-build-script:
    name: Windows build script
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('scripts/windows/build-windows.ps1', 'scripts/windows/test-installer-upgrade.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

  windows-installer-upgrade:
    name: Windows installer upgrade from 0.2.1
    needs: windows-build-script
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: C:\scale-upgrade-target
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> C:/scale-upgrade-target
          key: installer-upgrade-x64
      - run: npm ci --no-audit --no-fund
      - name: Build real Windows NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Install, upgrade handoff and uninstall with data preservation
        shell: pwsh
        run: ./scripts/windows/test-installer-upgrade.ps1

  frontend:
    name: Vue, TypeScript and Web/PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate version synchronization
        run: npm run ci:version && npm run ci:tauri

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web/PWA
        run: npm run build:web

      - name: Playground and simulator regression
        run: node --test tests/*.test.mjs
      - name: Install component-test browser
        run: npx playwright install --with-deps chromium
      - name: Compact model controls at desktop/mobile widths
        run: |
          npm run test:models:browser
          SCALE_UI_SCREENSHOTS=/tmp/scale-ui-evidence node tests/laboratory.browser.mjs
          node tests/laboratory-shell.browser.mjs

      - name: Preserve laboratory visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-laboratory-ui
          path: /tmp/scale-ui-evidence
          retention-days: 1
          if-no-files-found: ignore
      - name: Store Web/PWA for dependent checks outside pull requests
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  rust:
    name: Rust and Tauri
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Web/PWA for Tauri context outside pull requests
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ci-web-dist
          path: dist

      - name: Prepare deterministic Tauri assets for Rust checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            mkdir -p dist
            printf '%s\n' '<!doctype html><html><body>CI Rust validation</body></html>' > dist/index.html
          fi
          node ./scripts/prepare-tauri-resources.mjs

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Resolve Cargo lockfile
        run: test -f src-tauri/Cargo.lock

      - name: Preserve plain headless build without default features
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --manifest-path src-tauri/Cargo.toml --locked --no-default-features --edges normal,build \
            --prefix none --format '{p}' > /tmp/headless-packages.txt
          forbidden='^(tauri|tauri-build|tauri-runtime|tauri-runtime-wry|wry|gtk|gtk-sys|gdk|gdk-sys|webkit2gtk|webkit2gtk-sys|tray-icon|muda|libappindicator|libappindicator-sys)$'
          if awk '{print $1}' /tmp/headless-packages.txt | grep -E "${forbidden}"; then
            echo "Grafo headless contém dependências gráficas/Tauri." >&2
            exit 1
          fi
          cargo build --manifest-path src-tauri/Cargo.toml --locked --no-default-features

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features

  rust-features:
    name: Rust feature ${{ matrix.label }}
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: SQLite
            features: desktop
          - label: MySQL
            features: desktop,mysql-db
          - label: PostgreSQL
            features: desktop,postgres-db
          - label: MySQL and PostgreSQL
            features: desktop,mysql-db,postgres-db
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Web/PWA for Tauri context outside pull requests
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ci-web-dist
          path: dist

      - name: Prepare deterministic Tauri assets for feature checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            mkdir -p dist
            printf '%s\n' '<!doctype html><html><body>CI Rust feature validation</body></html>' > dist/index.html
          fi
          node ./scripts/prepare-tauri-resources.mjs

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: features-${{ matrix.features }}
          cache-on-failure: true

      - name: Resolve Cargo lockfile
        run: test -f src-tauri/Cargo.lock

      - name: Check database feature
        run: >-
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          --no-default-features --features "${{ matrix.features }}"

  cloudpanel-headless:
    name: CloudPanel headless Linux ${{ matrix.arch }}
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-gnu
          - arch: x86
            target: i686-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Web/PWA for CloudPanel outside pull requests
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ci-web-dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Rebuild Web/PWA locally when artifact storage is unavailable
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            npm ci --prefer-offline --no-audit --no-fund
            npm run build:web
          fi

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ci-cloudpanel-headless-${{ matrix.target }}
          cache-on-failure: true

      - name: Install CloudPanel build dependencies
        run: bash ./scripts/linux/install-cloudpanel-build-deps.sh --${{ matrix.arch }}

      - name: Build and package CloudPanel headless
        env:
          BUILD_WEB: "false"
        run: bash ./scripts/linux/build-cloudpanel-release.sh --${{ matrix.arch }}

      - name: Store validated CloudPanel package outside pull requests
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-cloudpanel-linux-${{ matrix.arch }}
          path: |
            release/cloudpanel/*linux-${{ matrix.arch }}.tar.gz
            release/cloudpanel/*linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  legacy-migration:
    name: Legacy SQLite migration and bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run executable migration scenarios
        run: >-
          cargo run --manifest-path tests/legacy-migration-harness/Cargo.toml
          --locked
